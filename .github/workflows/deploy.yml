name: Deploy to GitHub Pages

# Auto-deploys the site on every push to main (and can be run manually).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # the whole repo is the static site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
